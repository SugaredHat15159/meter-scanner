<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Meter Scanner</title>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@zxing/library@0.21.3/umd/index.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@zxing/browser@0.1.5/umd/zxing-browser.min.js"></script>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#111827;color:#fff}
  .wrap{max-width:640px;margin:0 auto;padding:1rem;padding-bottom:170px}
  h1{font-size:1.35rem;margin-bottom:.25rem}
  .stat{font-size:.72rem;color:#9ca3af;margin-bottom:.75rem}
  .tabs{display:flex;gap:.5rem;overflow-x:auto;padding-bottom:.5rem;margin-bottom:.5rem}
  .tab{padding:.5rem 1rem;border-radius:.375rem;font-weight:600;white-space:nowrap;border:none;font-size:.85rem}
  .tab.on{background:#2563eb;color:#fff}
  .tab.off{background:#374151;color:#d1d5db}
  .rin{padding:.5rem;border-radius:.375rem;background:#374151;color:#fff;border:none;font-size:.85rem;min-width:110px}
  .radd{padding:.5rem .8rem;background:#16a34a;color:#fff;border:none;border-radius:.375rem;font-weight:600}
  .manage{display:flex;gap:.5rem;margin-bottom:1rem}
  .mbtn{flex:1;padding:.5rem;border:none;border-radius:.375rem;font-size:.78rem;font-weight:600;color:#fff}
  .mbtn.rename{background:#4b5563}
  .mbtn.delete{background:#7f1d1d}
  .card{background:#1f2937;border-radius:.5rem;padding:1rem;margin-bottom:1rem;border:2px solid #374151}
  .card.hl{border-color:#3b82f6}
  .card.gun{border-color:#22c55e}
  .card h2{font-size:1rem;margin-bottom:.75rem}
  .gunhead{display:flex;align-items:center;justify-content:space-between;gap:.5rem}
  .gunhead h2{margin:0}
  .switch{display:flex;align-items:center;gap:.4rem;font-size:.8rem;font-weight:600}
  #hwInput{width:100%;margin-top:.7rem;padding:.7rem;border-radius:.375rem;border:2px solid #22c55e;background:#0b1f16;color:#fff;font-size:1rem;font-weight:700}
  .gunstatus{font-size:.72rem;margin-top:.4rem;color:#86efac}
  .gunstatus.off{color:#9ca3af}
  #reader{position:relative;width:100%;border-radius:.5rem;overflow:hidden;background:#000;min-height:40px}
  #video{width:100%;display:block;border-radius:.5rem}
  .aim{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:88%;aspect-ratio:2.4/1;border:2px solid #22c55e;border-radius:.4rem;box-shadow:0 0 0 2000px rgba(0,0,0,.18);pointer-events:none}
  .cambtns{display:flex;gap:.5rem;margin-bottom:.75rem}
  .startbtn{flex:1;background:#2563eb;color:#fff;border:none;padding:.9rem;border-radius:.375rem;font-weight:700;font-size:.95rem}
  .photobtn{flex:1;background:#7c3aed;color:#fff;border:none;padding:.9rem;border-radius:.375rem;font-weight:700;font-size:.95rem}
  .zoomwrap{margin-top:.6rem}
  .zoomwrap label{color:#9ca3af;font-size:.7rem;display:block;margin-bottom:.2rem}
  .zoomwrap input{width:100%}
  .field-now{background:#374151;padding:.75rem;border-radius:.375rem;margin:.75rem 0;text-align:center}
  .field-now .lbl{font-size:.7rem;color:#9ca3af}
  .field-now .val{font-size:1.3rem;font-weight:700;margin:.15rem 0}
  .field-now .seq{font-size:.66rem;color:#9ca3af}
  .toggle{display:flex;align-items:center;gap:.4rem;justify-content:center;margin-top:.4rem;font-size:.72rem;color:#cbd5e1}
  .apRow{display:none;justify-content:center;align-items:center;gap:.4rem;margin-top:.45rem}
  .apRow input{padding:.4rem;border-radius:.3rem;border:none;background:#4b5563;color:#fff;font-weight:700}
  .apRow .pfx{width:100px}.apRow .st{width:56px;text-align:center}
  .apRow .pv{color:#86efac;font-size:.72rem}
  .fieldrow{display:flex;gap:.4rem;margin-bottom:.6rem}
  .fbtn{flex:1;padding:.5rem;border:2px solid #4b5563;background:#374151;color:#cbd5e1;border-radius:.375rem;font-size:.7rem;font-weight:600}
  .fbtn.sel{border-color:#22c55e;color:#fff;background:#1e3a2f}
  .flowbtns{display:flex;gap:.4rem;margin-bottom:.6rem}
  .flowbtn{flex:1;border:none;border-radius:.375rem;padding:.6rem;font-weight:700;font-size:.8rem;color:#fff}
  .nextf{background:#2563eb}
  .skipl{background:#7c5e10}
  .nav{display:flex;align-items:center;justify-content:space-between;background:#374151;padding:.6rem;border-radius:.375rem}
  .nbtn{background:#2563eb;color:#fff;border:none;width:44px;height:44px;border-radius:.375rem;font-size:1.1rem}
  .nbtn:disabled{opacity:.4}
  .ninfo{text-align:center}.ninfo .p{font-weight:700}.ninfo .r{font-size:.7rem;color:#9ca3af}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:.6rem;margin-bottom:.75rem}
  .df{padding:.6rem;border-radius:.375rem;background:#374151;border:2px solid #4b5563;position:relative}
  .df.pos{border-color:#22c55e}.df.flex{border-color:#a855f7}.df.meter{border-color:#3b82f6}.df.other{border-color:#6b7280}
  .df.active{box-shadow:0 0 0 2px #fde047 inset}
  .df .lbl{font-size:.68rem;color:#9ca3af;display:block;margin-bottom:.2rem}
  .df .v{font-weight:700;min-height:22px;padding:.15rem;border-radius:.25rem}
  .df input{width:100%;background:#4b5563;color:#fff;border:none;border-radius:.25rem;padding:.3rem;font-weight:700;font-size:.9rem}
  .rowbtns{display:flex;gap:.5rem;margin-top:.5rem}
  .clr{flex:1;background:#dc2626;color:#fff;border:none;padding:.65rem;border-radius:.375rem;font-weight:700}
  .addpos{flex:1;background:#374151;color:#fff;border:none;padding:.65rem;border-radius:.375rem;font-weight:700}
  table{width:100%;border-collapse:collapse;font-size:.72rem}
  th{background:#374151;padding:.45rem;text-align:left;border:1px solid #4b5563}
  td{padding:.45rem;border:1px solid #4b5563;word-break:break-word}
  tr.cur{background:#1e3a8a}
  .del{text-align:center;color:#ef4444;font-weight:700}
  .foot{position:fixed;bottom:0;left:0;right:0;background:#111827;border-top:2px solid #374151;padding:.85rem}
  .foot .in{max-width:640px;margin:0 auto}
  .exp{width:100%;background:#16a34a;color:#fff;border:none;padding:.9rem;border-radius:.375rem;font-weight:700;font-size:1rem}
  .hint{font-size:.7rem;color:#9ca3af;text-align:center;margin-top:.4rem}
  .toast{position:fixed;top:1rem;left:50%;transform:translateX(-50%);background:#16a34a;color:#fff;padding:.6rem 1rem;border-radius:.375rem;font-weight:600;z-index:999;display:none;max-width:92vw;text-align:center}
</style>
</head>
<body>
<div class="wrap">
  <h1>Meter Scanner</h1>
  <div class="stat" id="stat">0 meters scanned</div>
  <div class="tabs" id="tabs"></div>
  <div class="manage">
    <button class="mbtn rename" id="renameBtn">✎ Rename Room</button>
    <button class="mbtn delete" id="deleteBtn">🗑 Delete Room</button>
  </div>

  <div class="card gun">
    <div class="gunhead">
      <h2>Hardware Scanner</h2>
      <label class="switch"><input type="checkbox" id="hwMode"> On</label>
    </div>
    <input type="text" id="hwInput" placeholder="Ready — pull trigger to scan" style="display:none" autocomplete="off">
    <div class="gunstatus off" id="hwStatus">Off — flip On when your scanner is plugged in</div>
  </div>

  <div class="card hl">
    <h2>Camera Scanner</h2>
    <div class="cambtns">
      <button class="startbtn" id="startBtn">▶ Live Camera</button>
      <button class="photobtn" id="photoBtn">📷 Scan from Photo</button>
    </div>
    <input type="file" accept="image/*" capture="environment" id="photoInput" style="display:none">
    <div id="reader"><video id="video" muted playsinline></video><div class="aim" id="aim" style="display:none"></div></div>
    <div class="zoomwrap" id="zoomWrap" style="display:none">
      <label>Zoom</label>
      <input type="range" id="zoom">
    </div>
    <div class="field-now">
      <div class="lbl">Scanning into</div>
      <div class="val" id="fieldNow">Position</div>
      <div class="seq" id="seq"></div>
      <label class="toggle"><input type="checkbox" id="autoAdv" checked> Auto-advance to next box</label>
      <label class="toggle"><input type="checkbox" id="skipOther" checked> Skip "Other"</label>
      <label class="toggle"><input type="checkbox" id="autoPos"> Auto-number Position (type prefix, counts up)</label>
      <div class="apRow" id="apRow">
        <input class="pfx" id="posPrefix" placeholder="WB1" autocomplete="off">
        <span style="color:#9ca3af">-</span>
        <input class="st" id="posStart" value="1" inputmode="numeric">
        <span class="pv" id="posPreview"></span>
      </div>
    </div>
    <div class="fieldrow" id="fieldRow"></div>
    <div class="flowbtns">
      <button class="flowbtn nextf" id="nextField">Next Field ▸</button>
      <button class="flowbtn skipl" id="skipLine">Skip Line (no meter)</button>
    </div>
    <div class="nav">
      <button class="nbtn" id="prev">◀</button>
      <div class="ninfo"><div class="p" id="posInfo">Position 1 of 10</div><div class="r" id="roomInfo">Room One</div></div>
      <button class="nbtn" id="next">▶</button>
    </div>
  </div>

  <div class="card">
    <h2 id="posTitle">Position 1</h2>
    <div class="grid">
      <div class="df pos" id="fPos"></div>
      <div class="df flex" id="fFlux"></div>
      <div class="df meter" id="fMeter"></div>
      <div class="df other" id="fOther"></div>
    </div>
    <div class="rowbtns">
      <button class="clr" id="clrCur">🗑 Clear Position</button>
      <button class="addpos" id="addPos">＋ Add Position</button>
      <button class="addpos" id="subPos">－ Remove Position</button>
    </div>
  </div>

  <div class="card">
    <h2 id="tblTitle">Room One</h2>
    <div style="overflow-x:auto">
      <table><thead><tr><th>Position</th><th>FlexNet ID</th><th>Meter ID</th><th>Other</th><th></th></tr></thead>
      <tbody id="tbody"></tbody></table>
    </div>
  </div>
</div>

<div class="foot"><div class="in">
  <button class="exp" id="expBtn">⬇ Export to Excel</button>
  <div class="hint">Downloads a file you can email or share</div>
</div></div>
<div class="toast" id="toast"></div>

<script>
const FIELDS=[['position','Position'],['fluxId','FlexNet ID'],['meterId','Meter ID'],['other','Other']];
const blank=()=>({position:'',fluxId:'',meterId:'',other:''});
let rooms={'Room One':Array(10).fill(0).map(blank)};
let order=['Room One'];
let room='Room One',pos=0,activeField='position',editing=null,scanning=false;
let autoAdvance=true, audioCtx=null;
let lockValue='', paused=false, lastScan={t:0,v:''};
let hwMode=false, skipOther=true;
let autoPos=false, posPrefix='', posStart=1; const posPad=3;
let stream=null, decodeTimer=null, reader=null, cropCanvas=document.createElement('canvas');

// which fields are in the scan sequence (respects the two toggles)
function seqKeys(){
  let ks=['position','fluxId','meterId','other'];
  if(autoPos)ks=ks.filter(k=>k!=='position');
  if(skipOther)ks=ks.filter(k=>k!=='other');
  return ks;
}
let anchorPos=0; // the line where the current prefix run starts
function posString(i){return posPrefix+'-'+String(posStart+(i-anchorPos)).padStart(posPad,'0');}
function stampPos(){if(autoPos&&posPrefix&&pos>=anchorPos){rooms[room][pos].position=posString(pos);save();}}
function stampForward(){if(autoPos&&posPrefix){for(let i=anchorPos;i<rooms[room].length;i++)rooms[room][i].position=posString(i);save();}}

// ---- ZXing setup ----
function getReader(){
  if(reader)return reader;
  const ZL=window.ZXing||window.ZXingBrowser, ZB=window.ZXingBrowser;
  if(!ZB||!ZL)return null;
  const hints=new Map();
  try{
    hints.set(ZL.DecodeHintType.TRY_HARDER,true);
    hints.set(ZL.DecodeHintType.POSSIBLE_FORMATS,[
      ZL.BarcodeFormat.CODE_39,ZL.BarcodeFormat.CODE_128,ZL.BarcodeFormat.CODE_93,
      ZL.BarcodeFormat.ITF,ZL.BarcodeFormat.EAN_13,ZL.BarcodeFormat.EAN_8,
      ZL.BarcodeFormat.UPC_A,ZL.BarcodeFormat.UPC_E,ZL.BarcodeFormat.QR_CODE
    ]);
  }catch(e){}
  reader=new ZB.BrowserMultiFormatReader(hints);
  return reader;
}

function load(){try{const s=localStorage.getItem('meterInv3');if(s){const o=JSON.parse(s);rooms=o.rooms;order=o.order||Object.keys(rooms);room=order[0];}}catch(e){}}
function save(){try{localStorage.setItem('meterInv3',JSON.stringify({rooms,order}))}catch(e){}}
function toast(m,color){const t=document.getElementById('toast');t.textContent=m;t.style.background=color||'#16a34a';t.style.display='block';clearTimeout(t._h);t._h=setTimeout(()=>t.style.display='none',1600)}
function beep(){try{audioCtx=audioCtx||new (window.AudioContext||window.webkitAudioContext)();const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.frequency.value=880;o.connect(g);g.connect(audioCtx.destination);g.gain.value=.15;o.start();o.stop(audioCtx.currentTime+.08)}catch(e){}}

function totalMeters(){let n=0;order.forEach(rm=>rooms[rm].forEach(r=>{if(r.meterId)n++}));return n}
function meterExists(val){let hit=false;order.forEach(rm=>rooms[rm].forEach((r,i)=>{if(r.meterId===val&&!(rm===room&&i===pos))hit=true}));return hit}

function refocusHw(){
  if(!hwMode||editing)return;
  const ae=document.activeElement;
  if(ae&&['INPUT','SELECT','TEXTAREA'].includes(ae.tagName)&&ae.id!=='hwInput')return;
  const el=document.getElementById('hwInput');if(el)el.focus();
}
function setHwMode(on){
  hwMode=on;
  const inp=document.getElementById('hwInput'),st=document.getElementById('hwStatus');
  inp.style.display=on?'block':'none';
  st.textContent=on?'● Ready — keep this window active and scan away':'Off — flip On when your scanner is plugged in';
  st.classList.toggle('off',!on);
  if(on){inp.value='';setTimeout(refocusHw,50);beep();}
}

function goPos(i){pos=i;activeField=seqKeys()[0];lockValue='';stampPos();render();refocusHw();}

function renderTabs(){
  const c=document.getElementById('tabs');c.innerHTML='';
  order.forEach(r=>{const b=document.createElement('button');b.className='tab '+(r===room?'on':'off');b.textContent=r;b.onclick=()=>{room=r;pos=0;activeField=seqKeys()[0];lockValue='';stampPos();render();refocusHw()};c.appendChild(b)});
  const i=document.createElement('input');i.className='rin';i.placeholder='New room…';i.id='newRoom';
  i.onkeydown=e=>{if(e.key==='Enter')addRoom()};
  const a=document.createElement('button');a.className='radd';a.textContent='+';a.onclick=addRoom;
  c.appendChild(i);c.appendChild(a);
}
function addRoom(){const i=document.getElementById('newRoom');const n=(i.value||'').trim();if(!n)return;if(rooms[n]){toast('Room already exists','#b45309');return;}rooms[n]=Array(10).fill(0).map(blank);order.push(n);room=n;pos=0;activeField=seqKeys()[0];lockValue='';save();render()}
function renameRoom(){const n=(prompt('Rename "'+room+'" to:',room)||'').trim();if(!n||n===room)return;if(rooms[n]){toast('That name is taken','#b45309');return;}rooms[n]=rooms[room];delete rooms[room];order=order.map(r=>r===room?n:r);room=n;save();render();}
function deleteRoom(){if(order.length<=1){toast('Keep at least one room','#b45309');return;}if(!confirm('Delete "'+room+'" and all its data?'))return;delete rooms[room];order=order.filter(r=>r!==room);room=order[0];pos=0;activeField=seqKeys()[0];lockValue='';save();render();}

function renderFieldRow(){
  const c=document.getElementById('fieldRow');c.innerHTML='';
  FIELDS.forEach(([k,l])=>{const b=document.createElement('button');b.className='fbtn'+(k===activeField?' sel':'');b.textContent=l;b.onclick=()=>{activeField=k;lockValue='';render();refocusHw()};c.appendChild(b)});
  document.getElementById('fieldNow').textContent=(FIELDS.find(f=>f[0]===activeField)||FIELDS[0])[1];
  const seq=seqKeys(),labels=seq.map(k=>FIELDS.find(f=>f[0]===k)[1]),sidx=seq.indexOf(activeField);
  document.getElementById('seq').textContent=`Step ${sidx>=0?sidx+1:'•'} of ${seq.length}  •  ${labels.join(' → ')}`;
}
function renderData(){
  const d=rooms[room][pos];
  const map=[['fPos','position','Position'],['fFlux','fluxId','FlexNet ID'],['fMeter','meterId','Meter ID'],['fOther','other','Other']];
  map.forEach(([id,key,lbl])=>{
    const el=document.getElementById(id);
    el.classList.toggle('active',key===activeField);
    if(editing===key){
      el.innerHTML=`<label class="lbl">${lbl}</label><input value="${(d[key]||'').replace(/"/g,'&quot;')}">`;
      const inp=el.querySelector('input');inp.focus();
      inp.onblur=()=>{d[key]=inp.value.trim();editing=null;save();render()};
      inp.onkeydown=e=>{if(e.key==='Enter'){d[key]=inp.value.trim();editing=null;save();if(autoAdvance)advanceField();else render();refocusHw()}};
    }else{
      el.innerHTML=`<label class="lbl">${lbl}</label><div class="v">${d[key]||'—'}</div>`;
      el.querySelector('.v').onclick=()=>{editing=key;render()};
    }
  });
}
function renderTable(){
  const tb=document.getElementById('tbody');tb.innerHTML='';
  rooms[room].forEach((r,i)=>{const tr=document.createElement('tr');if(i===pos)tr.className='cur';
    tr.innerHTML=`<td>${r.position||'—'}</td><td>${r.fluxId||'—'}</td><td>${r.meterId||'—'}</td><td>${r.other||'—'}</td><td class="del">✕</td>`;
    tr.querySelector('.del').onclick=e=>{e.stopPropagation();if(rooms[room].length>1){rooms[room].splice(i,1);if(pos>=rooms[room].length)pos=rooms[room].length-1;}else{rooms[room][0]=blank();}save();render()};
    tr.onclick=e=>{if(!e.target.classList.contains('del')){goPos(i)}};
    tb.appendChild(tr)});
}
function render(){
  document.getElementById('posInfo').textContent=`Position ${pos+1} of ${rooms[room].length}`;
  document.getElementById('roomInfo').textContent=room;
  document.getElementById('posTitle').textContent=`Position ${pos+1}`;
  document.getElementById('tblTitle').textContent=room;
  document.getElementById('stat').textContent=`${totalMeters()} meters scanned`;
  document.getElementById('prev').disabled=pos===0;
  document.getElementById('next').disabled=pos===rooms[room].length-1;
  const pv=document.getElementById('posPreview');if(pv)pv.textContent=(autoPos&&posPrefix)?('→ '+posString(pos)):'';
  renderTabs();renderFieldRow();renderData();renderTable();
}

function advanceField(){
  const seq=seqKeys();
  const idx=seq.indexOf(activeField);
  if(idx===-1){activeField=seq[0];}
  else if(idx<seq.length-1){activeField=seq[idx+1];}
  else{
    if(pos<rooms[room].length-1)pos++;else{rooms[room].push(blank());pos=rooms[room].length-1;}
    activeField=seq[0];stampPos();
  }
  render();
}
function nextLine(){lockValue='';if(pos<rooms[room].length-1)pos++;else{rooms[room].push(blank());pos=rooms[room].length-1;}activeField=seqKeys()[0];stampPos();save();render();refocusHw();}

function fillScan(text){
  if(!text)return;
  if(scanning&&paused)return;
  if(text===lockValue)return;
  const now=Date.now();
  if(text===lastScan.v&&now-lastScan.t<700)return;
  lastScan={t:now,v:text};
  lockValue=text;
  if(activeField==='meterId'&&meterExists(text)){toast('⚠ Meter already scanned: '+text,'#b45309');}
  else{toast('✓ '+text);}
  rooms[room][pos][activeField]=text;
  save();beep();
  if(navigator.vibrate)navigator.vibrate(60);
  if(scanning){paused=true;setTimeout(()=>{paused=false},1200);}
  if(autoAdvance)advanceField();else render();
  refocusHw();
}

// ---- live camera: ZXing decode on a centered crop ----
function decodeFrame(){
  const v=document.getElementById('video');
  if(!v.videoWidth||paused)return;
  const vw=v.videoWidth,vh=v.videoHeight;
  const cw=Math.round(vw*0.88), ch=Math.round(cw/2.4);
  const sx=Math.round((vw-cw)/2), sy=Math.round((vh-ch)/2);
  cropCanvas.width=cw;cropCanvas.height=ch;
  cropCanvas.getContext('2d').drawImage(v,sx,sy,cw,ch,0,0,cw,ch);
  try{
    const res=reader.decodeFromCanvas(cropCanvas);
    if(res){const t=res.getText();if(t)fillScan(t.trim());}
  }catch(e){/* no barcode this frame */}
}

async function startCam(){
  const btn=document.getElementById('startBtn'),v=document.getElementById('video'),aim=document.getElementById('aim');
  if(scanning){
    scanning=false;btn.textContent='▶ Live Camera';
    if(decodeTimer){clearInterval(decodeTimer);decodeTimer=null;}
    if(stream){stream.getTracks().forEach(t=>t.stop());stream=null;}
    v.srcObject=null;aim.style.display='none';document.getElementById('zoomWrap').style.display='none';
    return;
  }
  if(!getReader()){toast('Scanner engine not loaded — check connection','#b45309');return;}
  try{
    stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment',width:{ideal:1920},height:{ideal:1080}}});
    v.srcObject=stream;await v.play();
    scanning=true;btn.textContent='⏸ Stop';aim.style.display='block';
    if(typeof reader.decodeFromCanvas==='function'){
      decodeTimer=setInterval(decodeFrame,130);
    }else{
      reader.decodeFromVideoElement(v,(result)=>{if(result)fillScan(result.getText().trim());});
    }
    try{
      const track=stream.getVideoTracks()[0],caps=track.getCapabilities?track.getCapabilities():{};
      if(caps&&caps.zoom){
        const w=document.getElementById('zoomWrap'),s=document.getElementById('zoom');
        s.min=caps.zoom.min;s.max=caps.zoom.max;s.step=caps.zoom.step||0.1;
        const cur=track.getSettings().zoom;s.value=cur||caps.zoom.min;
        w.style.display='block';
        s.oninput=()=>track.applyConstraints({advanced:[{zoom:parseFloat(s.value)}]});
      }
    }catch(e){}
  }catch(e){toast('Camera blocked — needs https + permission','#b45309')}
}

async function scanPhoto(file){
  if(!file)return;
  if(!getReader()){toast('Scanner engine not loaded','#b45309');return;}
  const url=URL.createObjectURL(file);
  toast('Reading photo…');
  try{
    const res=await reader.decodeFromImageUrl(url);
    lockValue='';
    fillScan((res.getText()||'').trim());
  }catch(e){
    toast('No barcode found — get closer, fill the frame, hold level','#b45309');
  }finally{URL.revokeObjectURL(url);}
}

function exportXlsx(){
  const rows=[];
  order.forEach(rm=>rooms[rm].forEach(r=>{
    if(r.meterId||r.fluxId||r.position||r.other)rows.push({Room:rm,Position:r.position||'',['FlexNet ID']:r.fluxId||'',['Meter ID']:r.meterId||'',Other:r.other||''});
  }));
  if(!rows.length){toast('Nothing to export','#b45309');return;}
  const ws=XLSX.utils.json_to_sheet(rows);
  ws['!cols']=[{wch:14},{wch:14},{wch:16},{wch:16},{wch:14}];
  const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,'Meters');
  XLSX.writeFile(wb,`meter-inventory-${new Date().toISOString().slice(0,10)}.xlsx`);
}

// hardware scanner (focus-locked field)
const hwInput=document.getElementById('hwInput');
hwInput.addEventListener('keydown',e=>{
  if(e.key==='Enter'){e.preventDefault();const val=hwInput.value.trim();hwInput.value='';if(val)fillScan(val);}
  else if(e.key==='Tab'){e.preventDefault();const val=hwInput.value.trim();hwInput.value='';if(val){fillScan(val);}else{advanceField();}}
});
hwInput.addEventListener('blur',()=>{setTimeout(refocusHw,150)});
document.addEventListener('click',()=>{setTimeout(refocusHw,0)});

// fallback wedge capture when hardware mode is OFF
let buf='';
document.addEventListener('keydown',e=>{
  if(hwMode||editing)return;
  if(e.key==='Enter'){if(buf.trim())fillScan(buf.trim());buf='';}
  else if(e.key==='Tab'){e.preventDefault();advanceField();}
  else if(e.key.length===1)buf+=e.key;
});

document.getElementById('hwMode').onchange=e=>setHwMode(e.target.checked);
document.getElementById('startBtn').onclick=startCam;
document.getElementById('photoBtn').onclick=()=>document.getElementById('photoInput').click();
document.getElementById('photoInput').onchange=e=>{scanPhoto(e.target.files[0]);e.target.value='';};
document.getElementById('renameBtn').onclick=renameRoom;
document.getElementById('deleteBtn').onclick=deleteRoom;
document.getElementById('autoAdv').onchange=e=>{autoAdvance=e.target.checked};
document.getElementById('skipOther').onchange=e=>{skipOther=e.target.checked;if(seqKeys().indexOf(activeField)===-1)activeField=seqKeys()[0];render()};
document.getElementById('autoPos').onchange=e=>{autoPos=e.target.checked;document.getElementById('apRow').style.display=autoPos?'flex':'none';if(autoPos){anchorPos=pos;stampForward();if(seqKeys().indexOf(activeField)===-1)activeField=seqKeys()[0];}render();refocusHw()};
document.getElementById('posPrefix').oninput=e=>{posPrefix=e.target.value.trim();anchorPos=pos;stampForward();render()};
document.getElementById('posStart').oninput=e=>{posStart=parseInt(e.target.value,10);if(isNaN(posStart))posStart=1;anchorPos=pos;stampForward();render()};
document.getElementById('nextField').onclick=()=>{lockValue='';advanceField();refocusHw()};
document.getElementById('skipLine').onclick=()=>{nextLine()};
document.getElementById('prev').onclick=()=>{if(pos>0)goPos(pos-1)};
document.getElementById('next').onclick=()=>{if(pos<rooms[room].length-1)goPos(pos+1)};
document.getElementById('clrCur').onclick=()=>{rooms[room][pos]=blank();activeField=seqKeys()[0];lockValue='';stampPos();save();render();refocusHw()};
document.getElementById('addPos').onclick=()=>{rooms[room].push(blank());pos=rooms[room].length-1;activeField=seqKeys()[0];stampPos();save();render();refocusHw()};
document.getElementById('subPos').onclick=()=>{if(rooms[room].length>1){rooms[room].splice(pos,1);if(pos>=rooms[room].length)pos=rooms[room].length-1;save();render();refocusHw()}else{toast('Need at least one position','#b45309')}};
document.getElementById('expBtn').onclick=exportXlsx;

load();render();
</script>
</body>
</html>
